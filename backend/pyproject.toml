[project]
name = "tradingapp-backend"
version = "0.1.0"
description = "Signal-driven trading system for ICICI Direct (Breeze Connect)"
requires-python = ">=3.11"

dependencies = [
    "breeze-connect>=1.0.60",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "duckdb>=1.1.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 wants StrEnum. `str, Enum` is kept deliberately: it keeps repr() as
# `Side.BUY` in logs and tracebacks, which StrEnum flattens to a bare "buy".
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
